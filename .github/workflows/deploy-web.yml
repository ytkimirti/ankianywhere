name: Deploy web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Finish an in-flight deployment before starting the newest queued push.
concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      CARD_ORIGIN: https://ankianywhere-cards.vercel.app
    steps:
      - name: Check deployment configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Add the $name repository secret under Settings > Secrets and variables > Actions."
              exit 1
            fi
          done

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Fetch translations
        run: git submodule update --init --depth 1 ftl/core-repo ftl/qt-repo

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'

      - name: Install toolchains
        run: |
          rustup toolchain install 1.99.0 --profile minimal --target wasm32-wasip1
          mkdir -p "$HOME/opt/wasi-sdk" "$HOME/opt/binaryen" "$HOME/opt/protoc"
          curl -sSfL https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-27/wasi-sdk-27.0-x86_64-linux.tar.gz \
            | tar xz -C "$HOME/opt/wasi-sdk" --strip-components=1
          curl -sSfL https://github.com/WebAssembly/binaryen/releases/download/version_124/binaryen-version_124-x86_64-linux.tar.gz \
            | tar xz -C "$HOME/opt/binaryen" --strip-components=1
          curl -sSfL -o /tmp/protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v31.1/protoc-31.1-linux-x86_64.zip
          unzip -q /tmp/protoc.zip -d "$HOME/opt/protoc"
          echo "$HOME/opt/binaryen/bin" >> "$GITHUB_PATH"
          echo "WASI_SDK=$HOME/opt/wasi-sdk" >> "$GITHUB_ENV"
          echo "PROTOC=$HOME/opt/protoc/bin/protoc" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install dependencies
        run: |
          corepack enable
          yarn install --immutable

      - name: Build engine
        run: web/scripts/build-wasm.sh

      - name: Generate modules and vendor assets
        run: |
          web/scripts/gen-ts.sh
          web/scripts/vendor.sh

      - name: Run web tests
        run: bun test web/tests

      # Self-hosted copies (web/selfhost) have one domain, so this build shows
      # cards on the app's origin.
      - name: Build self-hosting site
        run: |
          (cd ts && ../node_modules/.bin/svelte-kit sync)
          cd web
          ../node_modules/.bin/svelte-kit sync
          ../node_modules/.bin/vite build
          node scripts/sw-integrity.mjs
          echo "$GITHUB_SHA" > build/BUILD
          mkdir -p "$RUNNER_TEMP/selfhost-dist/selfhost/api"
          mv build "$RUNNER_TEMP/selfhost-dist/site"
          cp selfhost/vercel.json "$RUNNER_TEMP/selfhost-dist/selfhost/"
          cp selfhost/api/ankiweb-proxy.js "$RUNNER_TEMP/selfhost-dist/selfhost/api/"
          tar czf "$RUNNER_TEMP/ankianywhere-web.tar.gz" -C "$RUNNER_TEMP/selfhost-dist" site selfhost

      - name: Build site
        run: |
          cd web
          VITE_CARD_ORIGIN="$CARD_ORIGIN" ../node_modules/.bin/vite build
          node scripts/sw-integrity.mjs
          cp -r vercel.json api build/

      - name: Install Vercel CLI
        run: bun install --global vercel@62.1.0

      - name: Deploy production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(vercel deploy web/build --prod --yes --token "$VERCEL_TOKEN")
          printf '### Production deployment\n\nhttps://ankianywhere.vercel.app (%s)\n' "$url" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: selfhost
          path: ${{ runner.temp }}/ankianywhere-web.tar.gz
          retention-days: 1

  # Only this job can write to the repository, and it runs no third-party actions.
  publish-selfhost:
    needs: deploy
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: selfhost

      - name: Publish as the web-latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=web-latest
          asset=ankianywhere-web.tar.gz
          if gh release view "$tag" > /dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/$tag" -f sha="$GITHUB_SHA" -F force=true > /dev/null
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "Anki Anywhere (latest web build)" \
              --notes "The newest build of the site, which [web/selfhost](https://github.com/$GH_REPO/tree/main/web/selfhost) deploys. Replaced on every push to main."
          fi
          # upload under another name first, so the asset is missing only between the delete and the rename
          cp "$asset" "next-$asset"
          gh release upload "$tag" "next-$asset" --clobber
          ids=$(gh api "repos/$GH_REPO/releases/tags/$tag" --jq '.assets[] | "\(.name) \(.id)"')
          old=$(awk -v n="$asset" '$1 == n { print $2 }' <<< "$ids")
          new=$(awk -v n="next-$asset" '$1 == n { print $2 }' <<< "$ids")
          if [[ -n "$old" ]]; then
            gh api -X DELETE "repos/$GH_REPO/releases/assets/$old"
          fi
          gh api -X PATCH "repos/$GH_REPO/releases/assets/$new" -f name="$asset" > /dev/null
