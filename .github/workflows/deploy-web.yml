name: Deploy web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # publishes the self-hosting build as the web-latest release

# Finish an in-flight deployment before starting the newest queued push.
concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      CARD_ORIGIN: https://ankianywhere-cards.vercel.app
    steps:
      - name: Check deployment configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Add the $name repository secret under Settings > Secrets and variables > Actions."
              exit 1
            fi
          done

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Fetch translations
        run: git submodule update --init --depth 1 ftl/core-repo ftl/qt-repo

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'

      - name: Install toolchains
        run: |
          rustup toolchain install 1.99.0 --profile minimal --target wasm32-wasip1
          mkdir -p "$HOME/opt/wasi-sdk" "$HOME/opt/binaryen" "$HOME/opt/protoc"
          curl -sSfL https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-27/wasi-sdk-27.0-x86_64-linux.tar.gz \
            | tar xz -C "$HOME/opt/wasi-sdk" --strip-components=1
          curl -sSfL https://github.com/WebAssembly/binaryen/releases/download/version_124/binaryen-version_124-x86_64-linux.tar.gz \
            | tar xz -C "$HOME/opt/binaryen" --strip-components=1
          curl -sSfL -o /tmp/protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v31.1/protoc-31.1-linux-x86_64.zip
          unzip -q /tmp/protoc.zip -d "$HOME/opt/protoc"
          echo "$HOME/opt/binaryen/bin" >> "$GITHUB_PATH"
          echo "WASI_SDK=$HOME/opt/wasi-sdk" >> "$GITHUB_ENV"
          echo "PROTOC=$HOME/opt/protoc/bin/protoc" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install dependencies
        run: |
          corepack enable
          yarn install --immutable

      - name: Build engine
        run: web/scripts/build-wasm.sh

      - name: Generate modules and vendor assets
        run: |
          web/scripts/gen-ts.sh
          web/scripts/vendor.sh

      - name: Run web tests
        run: bun test web/tests

      # Self-hosted copies (web/selfhost) have one domain, so this build shows
      # cards on the app's origin.
      - name: Build self-hosting site
        run: |
          (cd ts && ../node_modules/.bin/svelte-kit sync)
          cd web
          ../node_modules/.bin/svelte-kit sync
          ../node_modules/.bin/vite build
          node scripts/sw-integrity.mjs
          echo "$GITHUB_SHA" > build/BUILD
          tar czf "$RUNNER_TEMP/ankianywhere-web.tar.gz" -C build .

      - name: Build site
        run: |
          cd web
          VITE_CARD_ORIGIN="$CARD_ORIGIN" ../node_modules/.bin/vite build
          node scripts/sw-integrity.mjs
          cp -r vercel.json api build/

      - name: Install Vercel CLI
        run: bun install --global vercel@62.1.0

      - name: Deploy production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(vercel deploy web/build --prod --yes --token "$VERCEL_TOKEN")
          printf '### Production deployment\n\nhttps://ankianywhere.vercel.app (%s)\n' "$url" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish self-hosting build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=web-latest
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" -f sha="$GITHUB_SHA" -F force=true > /dev/null
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Anki Anywhere (latest web build)" \
              --notes "The newest build of the site, which [web/selfhost](https://github.com/$GITHUB_REPOSITORY/tree/main/web/selfhost) deploys. Replaced on every push to main."
          fi
          gh release upload "$tag" "$RUNNER_TEMP/ankianywhere-web.tar.gz" --repo "$GITHUB_REPOSITORY" --clobber
